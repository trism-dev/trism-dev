<svg xmlns="http://www.w3.org/2000/svg" width="830" height="56" viewBox="0 0 830 56" role="img" aria-label="04 stack">
<style>
text{font-family:ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace}
.blink{animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.scan{animation:s 6s linear infinite}
@keyframes s{from{transform:translateX(-120px)}to{transform:translateX(830px)}}
@media (prefers-reduced-motion:reduce){.blink,.scan{animation:none}}
</style>

<text x="0" y="36" fill="#ffb454" font-size="22" font-weight="700">04</text>
<text x="40" y="36" fill="#e6edf3" font-size="22" font-weight="700">stack</text>
<line x1="123.5" y1="29" x2="830" y2="29" stroke="#30363d" stroke-width="1.5"/>
</svg>
